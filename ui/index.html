<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prompt History</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <input id="search" type="search" placeholder="Search conversations…">
      <button id="refresh" title="Refresh" aria-label="Refresh">⟳</button>
    </div>
    <div class="tabs" role="tablist">
      <button data-view="project" class="active">Projects</button>
      <button data-view="branch">Branches</button>
    </div>
    <nav id="list"></nav>
  </aside>
  <main>
    <header id="chat-head" hidden>
      <div>
        <h1 id="chat-title"></h1>
        <div id="chat-meta"></div>
      </div>
      <label class="toggle"><input type="checkbox" id="show-tools" checked> Tool calls</label>
      <button id="export">Export .md</button>
    </header>
    <section id="chat"><p class="empty">Pick a conversation on the left.</p></section>
    <div id="toast" hidden></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
